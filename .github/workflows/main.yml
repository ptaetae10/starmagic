name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: chmod +x gradlew && ./gradlew build
        working-directory: examplemod-template-1.21.1
      - uses: actions/upload-artifact@v4
        with:
          name: starmagic-jar
          path: examplemod-template-1.21.1/build/libs/*.jar
        
